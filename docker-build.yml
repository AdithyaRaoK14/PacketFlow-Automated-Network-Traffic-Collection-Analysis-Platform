name: Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-images:
    name: Build all custom images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build haproxy image
        run: docker build -t packetflow/haproxy:ci ./haproxy

      - name: Build airflow image
        run: docker build -t packetflow/airflow:ci ./airflow

      - name: Build dashboard image
        run: docker build -t packetflow/dashboard:ci ./dashboard
