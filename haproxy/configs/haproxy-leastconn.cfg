global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend http_front
    bind *:80
    default_backend webservers

frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    http-request use-service prometheus-exporter if { path /metrics }

backend webservers
    # Sends each request to whichever server currently has the fewest
    # active connections - useful when requests take variable time.
    balance leastconn
    option httpchk GET /
    server s1 web1:80 check
    server s2 web2:80 check
    server s3 web3:80 check
