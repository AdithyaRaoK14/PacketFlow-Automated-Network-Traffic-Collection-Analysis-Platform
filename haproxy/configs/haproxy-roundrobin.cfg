global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend http_front
    bind *:80
    default_backend webservers

# Requests/sec, errors, connections, queue, per-server health - all exposed
# for free by HAProxy itself instead of us calculating them (Tier 1 #2).
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    # Prometheus-formatted metrics for Grafana (Tier 1 #1) at /metrics
    http-request use-service prometheus-exporter if { path /metrics }

backend webservers
    balance roundrobin
    option httpchk GET /
    server s1 web1:80 check
    server s2 web2:80 check
    server s3 web3:80 check
